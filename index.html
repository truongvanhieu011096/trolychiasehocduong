<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Tư Vấn THCS Tố Hữu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Nút Gọi + Form cố định -->
<div class="fixed-buttons">
    <a href="tel:0336175393" class="call-btn">📞 Gọi Thầy/Cô</a>
    <a href="https://forms.gle/PWc5rKJEGZw564zD8" target="_blank" class="form-btn">
        📝 Gửi Form ẩn danh
    </a>
</div>

<!-- Popup chọn tâm trạng ban đầu -->
<div id="popup" class="popup">
    <div class="popup-content">
        <h2>Em đang cảm thấy như thế nào hôm nay?</h2>
        <div class="popup-buttons">
            <button onclick="selectMood('Buồn')">Buồn</button>
            <button onclick="selectMood('Lo lắng')">Lo lắng</button>
            <button onclick="selectMood('Stress')">Stress</button>
            <button onclick="selectMood('Bị bắt nạt')">Bị bắt nạt</button>
            <button onclick="selectMood('Khác')">Khác</button>
        </div>
    </div>
</div>

<!-- Chat container -->
<div class="chat-container">
    <div class="chat-header">
        Chatbot Tư Vấn THCS Tố Hữu
        <small class="sub-title">Sản phẩm dự thi KHKT trường THCS Tố Hữu</small>
    </div>
    <div id="chatBox" class="chat-box"></div>
    <div class="chat-input">
        <input type="text" id="userInput" placeholder="Nhập tin nhắn...">
        <button onclick="send()">Gửi</button>
    </div>
</div>

<script src="chat.js"></script>
</body>
</html>
